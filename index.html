<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>knowledge graph</title>
  </head>
  <body>
    <!--
      The graph goes here, inlined, so the page works from file://.

      Build output keeps this exact placeholder. Whoever emits the final
      page (the skill's render command) replaces the text of this element
      with the kg/1 JSON document. Nothing else in the file is touched.
    -->
    <script id="kg-graph" type="application/json">__KG_GRAPH__</script>
    <!--
      The notes written beside the graph: `{ "<path>": "<markdown>" }`, inlined for the
      same reason the graph is — a page opened from file:// cannot fetch its neighbours.
      A graph without notes keeps the `{}` and nothing changes.
    -->
    <script id="kg-docs" type="application/json">__KG_DOCS__</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
